# Copy to /etc/cliproxyapi/config.yaml, replace both CHANGE_ME values, and keep
# the installed file private. CPA itself stays on loopback behind Nginx.
host: 127.0.0.1
port: 8317

tls:
  enable: false
  cert: ''
  key: ''

remote-management:
  allow-remote: true
  secret-key: CHANGE_ME_PRIVATE_MANAGEMENT_KEY
  disable-control-panel: false

auth-dir: /var/lib/cliproxyapi/auth
api-keys:
  - CHANGE_ME_PRIVATE_CLIENT_KEY

debug: false
logging-to-file: false
usage-statistics-enabled: true

# Account auth JSON files with no proxy field, or an explicitly empty proxy
# field, inherit this complete URL. Never use a numeric/string placeholder.
proxy-url: http://127.0.0.1:7890

request-retry: 3
max-retry-credentials: 0
max-retry-interval: 30
routing:
  strategy: round-robin
redis-usage-queue-retention-seconds: 60
ws-auth: false
